language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!supabase/migrations/**"
    - "!**/*.svg"
  path_instructions:
    - path: "theme-init.js"
      instructions: |
        The classic-JS to TypeScript migration is COMPLETE; all app code lives
        in TypeScript modules under src/ (bundled by Vite, typechecked with
        tsc, deployed to GitHub Pages, shipped as native iOS/Android via
        Capacitor). theme-init.js is the one intentional, permanent classic
        script: a render-blocking <head> primer loaded via
        partials/head-bottom.html. Do NOT suggest converting it to an ES
        module or moving it under src/: a deferred module runs after first
        paint and reintroduces the theme flash (FOUC) and the native
        inter-page flash. e2e/smoke-index.spec.ts asserts the tag stays a
        synchronous classic <script> in <head> (no async/defer/module) and
        that data-theme resolves; it does not exercise native transitions. It is
        `// @ts-check`'d and linted, so flag JSDoc types that diverge from
        usage, and keep it small, synchronous, and dependency-free.
    - path: "**/*.ts"
      instructions: |
        Prefer review comments about runtime correctness, security (XSS via
        innerHTML: user-authored text must go through escapeHtml from
        src/lib/html.ts or textContent; auth token handling), and Supabase
        row-level-security implications. src/lib/legacy-globals.ts copies
        module exports onto window for the inline <script> blocks in the HTML
        pages and for e2e page-context reads; that bridge is intentional and
        permanent, not leftover migration debt.
    - path: "**/*.html"
      instructions: |
        Ten HTML files are independent Vite entry points (index, recipe, taste,
        library, login, minerals, start, reset-password, support,
        privacy/index). Head structure is shared via partials injected at build
        time; flag drift between pages (e.g. analytics or Sentry snippets, or
        the /src/lib/legacy-globals.ts module entry, present in some but not
        all).
    - path: "**/*.{js,mjs,cjs,ts,mts,cts,tsx,html,css,sql,sh,swift,gradle}"
      instructions: |
        Docs in this repo restate code facts: file paths, the classic-JS to
        TypeScript migration status, page selectors and <h2> labels, CLI
        commands, version pins, and store-copy counts. If this change renames,
        moves, or deletes a source file, or renames a user-facing label, a CSS
        selector, or a command, verify the docs that reference it are updated IN
        THIS PR. Highest-drift docs: CLAUDE.md (the File map + Verification-stack
        notes), e2e/*.md runbooks (selectors, <h2> labels, file paths),
        SENTRY_SETUP.md, plans/README.md, and store/**. Flag any doc still
        pointing at the old path, name, or label. Note: `npm run docs:check`
        already verifies that file-path references resolve, so focus on what it
        cannot catch — selectors, labels, status prose, and counts.

chat:
  auto_reply: true
