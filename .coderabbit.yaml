language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!supabase/migrations/**"
    - "!**/*.svg"
  path_instructions:
    - path: "**/*.js"
      instructions: |
        The remaining root-level *.js files are LEGACY classic scripts (loaded
        via <script> tags, global scope via window) being actively migrated to
        TypeScript ES modules under src/. The project has no UI framework, but
        it IS bundled by Vite (vite.config.mts), typechecked with tsc, deployed
        to GitHub Pages via GitHub Actions (.github/workflows/ci.yml), and
        shipped as native iOS/Android via Capacitor; it is not "served as-is".
        constants.js and metrics.js carry `// @ts-check` with JSDoc types; the
        other classic files are untyped pending migration. Prefer review
        comments about runtime correctness, security (XSS via innerHTML, token
        handling), and Supabase row-level-security implications. DO flag when a
        touched classic .js file (the Phase-3 migration set named in CLAUDE.md)
        should be converted to a TS module under src/ and wired through
        src/lib/legacy-globals.ts; this migration is in progress, not deferred.
        Also flag if existing JSDoc types diverge from actual usage.
    - path: "**/*.html"
      instructions: |
        Ten HTML files are independent Vite entry points (index, recipe, taste,
        library, login, minerals, start, reset-password, support,
        privacy/index). Head structure is shared via partials injected at build
        time; flag drift between pages (e.g. analytics or Sentry snippets, or
        the /src/lib/legacy-globals.ts module entry, present in some but not
        all).
    - path: "**/*.{js,mjs,cjs,ts,mts,cts,tsx,html,css,sql,sh,swift,gradle}"
      instructions: |
        Docs in this repo restate code facts: file paths, the classic-JS to
        TypeScript migration status, page selectors and <h2> labels, CLI
        commands, version pins, and store-copy counts. If this change renames,
        moves, or deletes a source file, or renames a user-facing label, a CSS
        selector, or a command, verify the docs that reference it are updated IN
        THIS PR. Highest-drift docs: CLAUDE.md (the File map + Verification-stack
        notes), e2e/*.md runbooks (selectors, <h2> labels, file paths),
        SENTRY_SETUP.md, plans/README.md, and store/**. Flag any doc still
        pointing at the old path, name, or label. Note: `npm run docs:check`
        already verifies that file-path references resolve, so focus on what it
        cannot catch — selectors, labels, status prose, and counts.

chat:
  auto_reply: true
