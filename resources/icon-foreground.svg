<!--
  Source for the Android adaptive-icon foreground layer. Transparent
  background: the launcher composites this over icon-background.svg and
  applies a circular or rounded-square mask depending on the device's
  launcher theme.

  The layout is icon-only.svg scaled to 0.773 about the center, so the
  "20", "Ca" and wordmark keep the same spacing as the iOS icon. Do not
  pull the "20" or the wordmark in toward the "Ca" to save room: an
  earlier version did and the "20" sat on top of the "C".

  @capacitor/assets wraps this layer in a 16.7% inset
  (mipmap-anydpi-v26/ic_launcher.xml), so the whole canvas is the visible
  area and a circular mask touches its edges. Content must stay inside
  that circle (radius 512 about the center) with some margin.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <text x="255" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="108" fill="#3A5272">20</text>
  <text x="512" y="611" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="340" font-weight="500" fill="#4B8FE0">Ca</text>
  <text x="512" y="781" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="93">
    <tspan fill="#4B8FE0">cafe</tspan><tspan fill="#E8EEF8">lytic</tspan>
  </text>
</svg>
