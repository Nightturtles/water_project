name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN by default; the e2e and deploy jobs widen it
# per-job for exactly what they need (issue comments, Pages deploy).
permissions:
  contents: read

# Actions are pinned to commit SHAs (same policy as native.yml): mutable tags
# can be force-pushed by a compromised maintainer account, SHAs cannot. The
# trailing comment is the human-readable tag; Dependabot
# (.github/dependabot.yml) bumps the SHA and the comment together.

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Fail if a doc references a source file that no longer exists (drift guard).
      - run: npm run docs:check
      - run: npm test
      - run: npm run build
      - run: npm run build:verify
      # Verify Capacitor's Android scaffold is in sync with dist/ and package.json.
      # iOS sync requires macOS + Xcode, so it is not run in this Linux job; the
      # native.yml `ios-build` job runs `npx cap sync ios` on a macOS runner instead.
      - run: npx cap sync android --inline

  e2e:
    runs-on: ubuntu-latest
    # Fail fast if webServer hangs or browser wedges — protects the runner from
    # burning minutes on a stuck job.
    timeout-minutes: 15
    # smoke-sync + smoke-recipe sign in as ONE shared test account on prod
    # Supabase. e2e/_shared-account-lock.ts serializes them across workers on a
    # single runner, but two workflow runs (e.g. two open PRs pushed together)
    # land on separate runners, where that file lock can't reach. Concurrent
    # signed-in runs on one account are the race that planted the smoke-recipe
    # shadow row, so serialize the e2e job repo-wide. cancel-in-progress: false
    # lets the running job finish. queue: max keeps up to 100 pending jobs in
    # order; the default (single) would let a newer PR run replace a pending
    # push-to-main e2e job, cancelling it and skipping that push's deploy.
    # (queue: max cannot be combined with cancel-in-progress: true.)
    concurrency:
      group: e2e-shared-test-account
      cancel-in-progress: false
      queue: max
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Use cached browser downloads when possible; fall back to a fresh install.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        # System deps aren't cached by the browser cache; install them only.
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          CAFELYTIC_TEST_EMAIL: ${{ secrets.CAFELYTIC_TEST_EMAIL }}
          CAFELYTIC_TEST_PASSWORD: ${{ secrets.CAFELYTIC_TEST_PASSWORD }}
      # Telemetry: post a one-line flake summary to the tracking issue on
      # push-to-main runs. Skipped silently on PRs and when the repo variable
      # FLAKE_TRACKING_ISSUE is unset (one-time setup). continue-on-error keeps
      # logger hiccups from masking the real e2e outcome.
      - name: Post flake summary to tracking issue
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLAKE_TRACKING_ISSUE != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          body=$(node scripts/append-flake-log.cjs)
          gh issue comment "${{ vars.FLAKE_TRACKING_ISSUE }}" --body "$body" --repo "$GITHUB_REPOSITORY"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno lint
        working-directory: supabase/functions
      - run: deno check submit-support/index.ts
        working-directory: supabase/functions
      # --no-check: the handler is type-checked by the `deno check` step above;
      # the test file imports `node:assert`, whose type-check pulls @types/node,
      # which isn't present in this node_modules-free job. Tests still run
      # (node:assert works at runtime), so this keeps the gate without an install.
      - run: deno test --allow-env --no-check
        working-directory: supabase/functions

  # Builds dist/ with Vite and publishes to GitHub Pages.
  # Gated to push-to-main; PRs never deploy. Depends on the full PR-gating
  # suite so a red typecheck/test/build or red e2e blocks the publish.
  # deploy-pages occasionally fails with "Deployment failed, try again later"
  # (GitHub-side, seen when several pushes land within a minute); that is
  # transient, so re-run the job rather than debugging it.
  deploy:
    needs: [typecheck-and-test, e2e, edge-functions]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # SENTRY_AUTH_TOKEN gates @sentry/vite-plugin's sourcemap upload + release
      # injection. Scoped to the deploy job only: the typecheck-and-test job's
      # build runs without it so PR builds don't pollute Sentry with one
      # release per commit. errorHandler in vite.config.mts converts upload
      # failures (e.g. rotated token) to warnings, so a broken token still
      # produces a deployable dist/.
      - run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # v4+ excludes dotfiles from the artifact. dist/ has none today; if one is
      # ever added (e.g. .well-known/ for universal links), set
      # include-hidden-files: true here or it silently won't deploy.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
